# UN entraînement en 2 parties qui se suivent, sur GPU gratuit Colab T4 (voir training/parts.py).
# DONNÉES PUBLIQUES SOUS LICENCE OUVERTE UNIQUEMENT : jamais de document client.
# Ne change rien ici entre deux parties : la reprise serait refusée.
# Très peu d'exemples (une cinquantaine) : la LoRA apprend le FORMAT, la citation et le refus, jamais des faits.
# Réglages prudents : peu d'époques, taux d'apprentissage bas, arrêt si l'erreur de validation remonte.
name: colab-parties
public_data_only: true
base_model: Qwen/Qwen3-4B
base_revision: 1cfa9a7208912126459214e8b04321603b3df60c
base_tag: qwen3:4b       # gabarit et paramètres Ollama (figés dans training/ollama/qwen3-4b.Modelfile)
precision: fp16          # T4 : pas de bf16
compute_dtype: fp16
quant: nf4_double        # QLoRA 4 bits
lora: {r: 16, alpha: 32, dropout: 0.05, modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
lr: 1.0e-4
scheduler: cosine
warmup_ratio: 0.1
epochs: 3
val_examples: 16
max_seq_len: 2048
batch_size: 1
grad_accum: 4
gradient_checkpointing: true
optimizer: paged_adamw_8bit
parts: 2
eval_every: 4            # pas entre deux mesures de l'erreur de validation
early_stop_patience: 2   # arrêt après 2 mesures de suite au-dessus de la meilleure
save_every_min: 5
keep_checkpoints: 2
min_free_gb: 3.0
max_gpu_temp: 85
