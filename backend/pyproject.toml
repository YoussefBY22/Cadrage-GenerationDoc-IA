[project]
name = "cadrage-backend"
version = "0.1.0"
description = "Assistant IA local de cadrage : API et logique IA (100 % hors ligne)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2",
    "alembic",
    "pgvector",
    "pypdf",
    "python-docx",
    "python-pptx",
    "snowballstemmer",
    "pyyaml",
    "python-multipart",
    "argon2-cffi",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "reportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: nécessite TEST_POSTGRES_URL (PostgreSQL + pgvector)",
    "soffice: nécessite LibreOffice (soffice) installé",
    "slow: test lent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
