id: cdc-en-standard
version: '1.0'
type: cdc
language: en
title: Functional Specifications
referentiels:
- ISO/IEC/IEEE 29148:2018 (requirements engineering)
sections:
- key: perimetre
  title: Scope
  instructions: 'Define the scope of the project: what is included and excluded, according to the sources.'
  queries:
  - project scope
  - purpose of the requirement
  - limits and exclusions
  min_sources: 2
  max_sentences: 8
  uses_findings: true
  referentiels:
  - ISO/IEC/IEEE 29148 (system scope)
- key: fonctionnelles
  title: Functional requirements
  instructions: List the functional requirements as short statements ("The system shall…"), numbered REQ-1, REQ-2…,
    one requirement per sentence, unambiguous, each verifiable and tied to a source or a finding.
  queries:
  - functional requirements
  - expected features
  - business needs
  min_sources: 2
  max_sentences: 12
  uses_findings: true
  referentiels:
  - ISO/IEC/IEEE 29148 (identified REQ-n, unique, verifiable requirements)
- key: non_fonctionnelles
  title: Non-functional requirements
  instructions: List performance, security, availability and other sourced non-functional requirements, numbered
    NFR-1, NFR-2…, each measurable (threshold or criterion given by the sources).
  queries:
  - non-functional requirements
  - security and performance
  - availability and operations
  min_sources: 2
  max_sentences: 10
  uses_findings: false
  referentiels:
  - ISO/IEC/IEEE 29148 (performance and quality requirements)
- key: contraintes
  title: Constraints
  instructions: Describe the technical, regulatory, budgetary and schedule constraints cited in the sources.
  queries:
  - technical constraints
  - regulatory and budget constraints
  - imposed deadlines
  min_sources: 2
  max_sentences: 8
  uses_findings: false
  referentiels:
  - ISO/IEC/IEEE 29148 (design and compliance constraints)
- key: recette
  title: Acceptance conditions
  instructions: Describe the acceptance criteria and the verification method (inspection, analysis, demonstration,
    test) given in the sources, referring to the REQ/NFR requirements concerned.
  queries:
  - acceptance and validation
  - acceptance criteria
  - acceptance testing
  min_sources: 1
  max_sentences: 8
  uses_findings: false
  referentiels:
  - 'ISO/IEC/IEEE 29148 (verification method: inspection, analysis, demonstration, test)'
