id: tor-en-standard
version: '1.0'
type: tor
language: en
title: Terms of Reference
referentiels:
- 'World Bank: guide to writing terms of reference'
- 'European Commission: PM² and project cycle management'
sections:
- key: contexte
  title: Background and rationale
  instructions: Summarise the institutional context and the findings that justify the assignment.
  queries:
  - institutional context
  - diagnostic findings
  - challenges
  min_sources: 2
  max_sentences: 10
  uses_findings: true
  referentiels:
  - 'World Bank (ToR: background and rationale)'
  - PM² (initiation phase, business case)
- key: objectifs
  title: Objectives of the assignment
  instructions: State the overall and specific objectives of the assignment, linked to the findings.
  queries:
  - objectives of the assignment
  - expected results
  - stated needs
  min_sources: 2
  max_sentences: 8
  uses_findings: true
  referentiels:
  - 'World Bank (ToR: objectives and expected results)'
  - EU project cycle management (intervention logic)
- key: livrables
  title: Expected deliverables
  instructions: List the expected deliverables with their content, only those supported by the sources.
  queries:
  - expected deliverables
  - outputs to be submitted
  - documents to be produced
  min_sources: 2
  max_sentences: 10
  uses_findings: false
  referentiels:
  - 'World Bank (ToR: deliverables and reporting schedule)'
  - PM² (deliverables and acceptance criteria)
- key: calendrier
  title: Assignment schedule
  instructions: Describe the duration and milestones of the assignment as set by the confirmed decisions.
  queries:
  - assignment schedule
  - duration and milestones
  - deadlines
  min_sources: 1
  max_sentences: 8
  uses_findings: false
  requires_decisions:
  - schedule
  referentiels:
  - 'World Bank (ToR: duration and milestones)'
  - PM² (planning)
- key: profil
  title: Expert profiles
  instructions: Describe the expert profiles and qualifications as set by the confirmed decisions.
  queries:
  - expert profiles
  - required qualifications
  - required experience
  min_sources: 1
  max_sentences: 8
  uses_findings: false
  requires_decisions:
  - profile
  referentiels:
  - 'World Bank (ToR: consultant qualifications and experience)'
- key: evaluation
  title: Evaluation criteria
  instructions: Present the evaluation criteria as set by the confirmed decisions.
  queries:
  - evaluation criteria
  - scoring grid
  - selection of proposals
  min_sources: 1
  max_sentences: 8
  uses_findings: false
  requires_decisions:
  - criterion
  referentiels:
  - World Bank (weighted proposal evaluation criteria)
  - 'OECD-DAC (evaluation criteria: relevance, effectiveness, efficiency, sustainability)'
