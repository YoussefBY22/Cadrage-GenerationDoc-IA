id: cdc-fr-standard
version: '1.0'
type: cdc
language: fr
title: Cahier des charges
referentiels:
- ISO/IEC/IEEE 29148:2018 (ingénierie des exigences)
sections:
- key: perimetre
  title: Périmètre
  instructions: 'Délimite le périmètre du projet : ce qui est inclus et exclu, d''après les sources.'
  queries:
  - périmètre du projet
  - objet du besoin
  - limites et exclusions
  min_sources: 2
  max_sentences: 8
  uses_findings: true
  referentiels:
  - ISO/IEC/IEEE 29148 (périmètre du système)
- key: fonctionnelles
  title: Exigences fonctionnelles
  instructions: Énumère les exigences fonctionnelles sous forme d'énoncés courts « Le système doit… », numérotées
    REQ-1, REQ-2…, une exigence par phrase, sans ambiguïté, chacune vérifiable et rattachée à une source ou un constat.
    Une information qu'une recommandation ou un constat demande de produire ou de suivre est une exigence.
  queries:
  - exigences fonctionnelles
  - recommandations du rapport
  - fonctionnalités attendues
  - besoins métiers
  min_sources: 2
  max_sentences: 12
  uses_findings: true
  referentiels:
  - ISO/IEC/IEEE 29148 (exigences identifiées REQ-n, uniques, vérifiables)
- key: non_fonctionnelles
  title: Exigences non fonctionnelles
  instructions: Énumère performance, sécurité, disponibilité et autres exigences non fonctionnelles sourcées, numérotées
    NFR-1, NFR-2…, chacune mesurable (seuil ou critère indiqué par les sources).
  queries:
  - exigences non fonctionnelles
  - sécurité et performance
  - disponibilité et exploitation
  min_sources: 2
  max_sentences: 10
  uses_findings: false
  referentiels:
  - ISO/IEC/IEEE 29148 (exigences de performance et de qualité)
- key: contraintes
  title: Contraintes
  instructions: Décris les contraintes techniques, réglementaires, budgétaires et de délai citées dans les sources.
  queries:
  - contraintes techniques
  - contraintes réglementaires et budgétaires
  - délais imposés
  min_sources: 2
  max_sentences: 8
  uses_findings: false
  referentiels:
  - ISO/IEC/IEEE 29148 (contraintes de conception et de conformité)
- key: recette
  title: Conditions de recette
  instructions: Décris les critères d'acceptation et la méthode de vérification (inspection, analyse, démonstration,
    essai) indiqués dans les sources, en renvoyant aux exigences REQ/NFR concernées.
  queries:
  - recette et validation
  - critères d'acceptation
  - tests de réception
  min_sources: 1
  max_sentences: 8
  uses_findings: false
  referentiels:
  - 'ISO/IEC/IEEE 29148 (méthode de vérification : inspection, analyse, démonstration, essai)'
