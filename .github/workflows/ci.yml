name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest   # aucun GPU, aucun modèle : tout passe par FakeProvider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.lock pytest ruff reportlab
      - run: cd backend && ruff check .
      - run: cd backend && pytest -q
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_DB=ci POSTGRES_USER=ci POSTGRES_PASSWORD=ci docker compose config -q
