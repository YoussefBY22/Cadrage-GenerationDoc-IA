# Démarrage : cp deploy/env.production.example .env  (puis renseigner)  &&  docker compose up -d --build
# Confidentialité (C1) : api, db, frontend et ollama sont UNIQUEMENT sur le réseau « internal »
# (aucune route vers Internet). Seul le proxy inverse est sur « edge » pour publier le port local.
# Profils : « llm » = Ollama dans Docker (optionnel) ; « bi » = Metabase (deploy/docker-compose.bi.yml).
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?voir deploy/env.production.example}
      POSTGRES_USER: ${POSTGRES_USER:?voir deploy/env.production.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir deploy/env.production.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]          # pas de port publié

  api:
    image: cadrage/api:0.1.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: token
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [internal]          # JAMAIS sur edge : l'API ne peut pas sortir vers Internet

  frontend:
    image: cadrage/frontend:0.1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""   # vide = même origine (le proxy route /api/ vers l'API)
    depends_on: [api]
    restart: unless-stopped
    networks: [internal]

  proxy:
    image: nginx:1.27.3-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8080}:8080"   # local uniquement ; mettre un TLS devant pour un accès réseau
    depends_on: [api, frontend]
    restart: unless-stopped
    networks: [internal, edge]    # seul service sur edge : reverse proxy sans client sortant

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama      # modèles copiés depuis le paquet hors ligne (aucun pull en production)
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    internal: true   # aucune route vers l'extérieur
  edge: {}           # uniquement pour publier le port du proxy sur la machine

volumes:
  pgdata:
  uploads:
  ollama:
