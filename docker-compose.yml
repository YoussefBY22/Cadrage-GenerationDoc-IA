# Démarrage : cp .env.example .env && docker compose up --build
# Confidentialité (C1) : la base est sur un réseau « internal » (sans sortie vers Internet).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?voir .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal, edge]

networks:
  internal:
    internal: true   # aucune route vers l'extérieur
  edge: {}           # nécessaire uniquement pour publier le port sur la machine locale

volumes:
  pgdata:
