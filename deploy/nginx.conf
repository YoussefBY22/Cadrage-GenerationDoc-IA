# Proxy inverse : seul point d'entrée. Aucune directive proxy vers l'extérieur.
server {
    listen 8080;
    server_name _;
    client_max_body_size 30m;   # > max_upload_mb (25)
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;   # génération locale lente
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /health { proxy_pass http://api:8000/health; }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}
